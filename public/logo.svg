<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <defs>
    <style>
      .white-stroke { fill: none; stroke: #FFFFFF; stroke-linecap: round; stroke-linejoin: round; }
      .red-stroke { fill: none; stroke: #FF0000; stroke-linecap: round; stroke-linejoin: round; }
      .red-fill { fill: #FF0000; }
    </style>
  </defs>

  <!-- Left: Monitor Silhouette Icon -->
  <g transform="translate(15, 10)">
    <!-- Monitor Stand Base -->
    <path d="M 105 240 L 175 240 C 180 240 185 245 185 250 L 185 255 L 95 255 L 95 250 C 95 245 100 240 105 240 Z" class="white-stroke" stroke-width="4"/>
    <path d="M 85 255 L 195 255" class="white-stroke" stroke-width="4"/>

    <!-- Outer Monitor Frame (with diagonal cut on bottom-right) -->
    <path d="M 65 18 
             L 245 18 
             A 22 22 0 0 1 267 40 
             L 267 85 
             L 172 245 
             A 12 12 0 0 1 160 252 
             L 55 252 
             A 22 22 0 0 1 33 230 
             L 33 42 
             A 24 24 0 0 1 65 18 Z" 
          class="white-stroke" 
          stroke-width="5.5"/>

    <!-- Inner Screen Bezel Frame -->
    <path d="M 60 34 
             L 238 34 
             A 12 12 0 0 1 250 46 
             L 250 88 
             L 165 233 
             A 8 8 0 0 1 158 238 
             L 50 238 
             A 12 12 0 0 1 38 226 
             L 38 48 
             A 14 14 0 0 1 60 34 Z" 
          class="white-stroke" 
          stroke-width="3.5"
          opacity="0.9"/>

    <!-- Dynamic Red Diagonal Accent Swoop -->
    <polygon points="175,252 198,208 267,95 267,125 194,252" class="red-fill"/>
    <polygon points="172,252 188,252 267,128 267,112" class="red-fill" opacity="0.95"/>
  </g>

  <!-- Right: OUZZE Text (Exact Bold Rounded Red) -->
  <g class="red-stroke" stroke-width="21">
    <!-- O -->
    <path d="M 335 62 A 36 44 0 0 1 407 62 L 407 92 A 36 44 0 0 1 335 92 Z"/>
    
    <!-- U -->
    <path d="M 436 38 L 436 86 A 25 30 0 0 0 486 86 L 486 38"/>
    
    <!-- Z (1) -->
    <path d="M 514 38 L 566 38 L 514 116 L 566 116"/>
    
    <!-- Z (2) -->
    <path d="M 594 38 L 646 38 L 594 116 L 646 116"/>
    
    <!-- E -->
    <path d="M 724 38 L 674 38 L 674 116 L 724 116 M 674 77 L 718 77"/>
  </g>

  <!-- Right: LOCAÇÃO Text (Exact Outlined/Hollow White Font) -->
  <g class="white-stroke" stroke-width="2.8" opacity="0.95">
    <!-- L -->
    <path d="M 350 162 L 350 208 L 372 208"/>
    
    <!-- O -->
    <path d="M 388 174 A 17 17 0 1 1 414 196 A 17 17 0 0 1 388 174 Z"/>
    
    <!-- C -->
    <path d="M 456 172 A 19 19 0 0 0 430 188 A 19 19 0 0 0 456 205"/>
    
    <!-- A -->
    <path d="M 472 208 L 488 162 L 504 208 M 478 194 L 498 194"/>
    
    <!-- Ç (C with cedilla) -->
    <path d="M 542 172 A 19 19 0 0 0 516 188 A 19 19 0 0 0 542 205 M 528 208 C 530 214 524 218 529 222"/>
    
    <!-- Ã (A with tilde) -->
    <path d="M 558 208 L 574 162 L 590 208 M 564 194 L 584 194 M 566 153 Q 574 146 582 153"/>
    
    <!-- O -->
    <path d="M 604 174 A 17 17 0 1 1 630 196 A 17 17 0 0 1 604 174 Z"/>
  </g>
</svg>
